.dot{width:10px;height:10px;border-radius:50%}
.dot-r{background:#185fa5}
.dot-g{background:#1D9E75}
.nav{display:flex;gap:1px;background:#e0e0d8;border-radius:10px;overflow:hidden;margin-bottom:16px}

.badge{display:inline-flex;align-items:center;justify-content:center;background:#185fa5;color:white;border-radius:10px;font-size:10px;font-weight:500;min-width:18px;height:18px;padding:0 5px;margin-left:4px}

.tab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:0.5px solid #ccc;background:#fff;color:#888;font-size:13px;cursor:pointer;transition:all .15s}
.tab.active{background:#185fa5;color:#fff;border-color:#185fa5}
.day-view{display:none}.day-view.active{display:block}

.meal-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.meal-icon{font-size:18px}
.meal-name{flex:1;font-size:14px;font-weight:500;color:#1a1a18}
.meal-checks{display:flex;gap:6px;align-items:center}
.chk{width:26px;height:26px;border-radius:7px;border:1.5px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:10px;font-weight:600;color:#ccc}
.chk-r.checked{background:#185fa5;border-color:#185fa5;color:white}
.chk-g.checked{background:#1D9E75;border-color:#1D9E75;color:white}
.ingredients{padding:0 14px 12px;border-top:0.5px solid #f0f0e8}
.ing-item{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:13px;color:#555;border-bottom:0.5px solid #f0f0e8}
.ing-item:last-child{border-bottom:none}
.ing-name{flex:1;color:#333}
.qty-r{font-size:12px;color:#185fa5;font-weight:500;min-width:48px;text-align:right}
.qty-g{font-size:12px;color:#1D9E75;font-weight:500;min-width:48px;text-align:right}
.qty-none{font-size:12px;color:#ddd;min-width:48px;text-align:right}
.ing-header{display:flex;align-items:center;gap:6px;padding:6px 0 4px;font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.05em;border-bottom:0.5px solid #f0f0e8}
.ing-header .qty-r,.ing-header .qty-g{font-size:10px;font-weight:600}

.shopping{background:#fff;border-radius:12px;border:0.5px solid #e0e0d8;overflow:hidden}
.shop-header{padding:14px 16px;border-bottom:0.5px solid #e0e0d8;display:flex;align-items:center;justify-content:space-between}
.shop-title{font-size:15px;font-weight:500;color:#1a1a18}
.shop-count{font-size:12px;color:#aaa}
.shop-empty{padding:32px;text-align:center;color:#aaa;font-size:13px}
.shop-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:0.5px solid #f0f0e8;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shop-item:last-child{border-bottom:none}
.shop-item:active{background:#f5f5f0}
.shop-cb{width:22px;height:22px;border-radius:50%;border:1.5px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.shop-cb.done{background:#639922;border-color:#639922}
.shop-cb i{font-size:12px;color:transparent}

.shop-qg{font-size:11px;color:#1D9E75;font-weight:500}
.shop-total{font-size:12px;color:#888;font-weight:500;white-space:nowrap}

const selR=new Set(), selG=new Set(), shopDone=new Set();

function parseGrams(q){
  if(!q)return 0;
  const m=q.match(/[\d.]+/);
  return m?parseFloat(m[0]):0;
}
function getUnit(q){
  if(!q)return'';
  return q.replace(/[\d.]+/,'').trim();
}

function getMealIngredients(meal){
  const map={};
  const addIngs=(ings,who)=>{
    if(!ings)return;
    ings.forEach(i=>{
      if(!i.q)return;
      if(!map[i.n])map[i.n]={r:null,g:null,unit:getUnit(i.q)};
      map[i.n][who]=parseGrams(i.q);
      if(!map[i.n].unit)map[i.n].unit=getUnit(i.q);
    });
  };
  if(selR.has(meal.id))addIngs(meal.r,'r');
  if(selG.has(meal.id))addIngs(meal.g,'g');
  return map;
}

function buildMenuDays(){
  Object.entries(MENU).forEach(([day,data])=>{
    const el=document.getElementById('day-'+day);
    el.innerHTML='<div class="section-title">'+data.label+'</div>'+
    data.meals.map(m=>{
      const hasR=!!m.r, hasG=!!m.g;
      return`<div class="meal-card">
        <div class="meal-header">
          <span class="meal-icon">${m.icon}</span>
          <span class="meal-name">${m.name}</span>
          <div class="meal-checks">
            ${hasR?`<div class="chk chk-r" id="chkr-${m.id}" onclick="toggleMeal('${m.id}','r',this)">R</div>`:'<div style="width:26px"></div>'}
            ${hasG?`<div class="chk chk-g" id="chkg-${m.id}" onclick="toggleMeal('${m.id}','g',this)">G</div>`:'<div style="width:26px"></div>'}
          </div>
        </div>
        <div class="ingredients" style="display:none" id="ing-${m.id}">
          <div class="ing-header">
            <span style="flex:1">Ingrediente</span>
            ${hasR?'<span class="qty-r">Rober</span>':''}
            ${hasG?'<span class="qty-g">Gema</span>':''}
          </div>
          ${mergeIngs(m.r,m.g,hasR,hasG)}
        </div>
      </div>`;
    }).join('');
  });
}

function mergeIngs(rIngs,gIngs,hasR,hasG){
  const names=[];
  const rMap={},gMap={};
  (rIngs||[]).forEach(i=>{if(!names.includes(i.n))names.push(i.n);rMap[i.n]=i.q;});
  (gIngs||[]).forEach(i=>{if(!names.includes(i.n))names.push(i.n);gMap[i.n]=i.q;});
  return names.map(n=>`<div class="ing-item">
    <span class="ing-name">${n}</span>
    ${hasR?`<span class="qty-r">${rMap[n]||'—'}</span>`:''}
    ${hasG?`<span class="qty-g">${gMap[n]||'—'}</span>`:''}
  </div>`).join('');
}

function toggleMeal(id,who,el){
  const ingEl=document.getElementById('ing-'+id);
  const set=who==='r'?selR:selG;
  if(set.has(id)){set.delete(id);el.classList.remove('checked');}
  else{set.add(id);el.classList.add('checked');}
  ingEl.style.display=(selR.has(id)||selG.has(id))?'block':'none';
  updateShoppingList();
}

function updateShoppingList(){
  const products={};
  Object.values(MENU).forEach(day=>{
    day.meals.forEach(m=>{
      const addIngs=(ings,who)=>{
        if(!ings)return;
        ings.forEach(i=>{
          if(!i.q)return;
          const key=i.n;
          if(!products[key])products[key]={r:0,g:0,unit:getUnit(i.q)};
          products[key][who]+=parseGrams(i.q);
          if(!products[key].unit)products[key].unit=getUnit(i.q);
        });
      };
      if(selR.has(m.id))addIngs(m.r,'r');
      if(selG.has(m.id))addIngs(m.g,'g');
    });
  });
  const items=Object.entries(products);
  const listEl=document.getElementById('shop-list');
  const countEl=document.getElementById('shop-count');
  const btn=document.getElementById('lista-btn');
  countEl.textContent=items.length+' producto'+(items.length!==1?'s':'');
  btn.innerHTML=`<i class="ti ti-shopping-cart"></i> Lista${items.length>0?'<span class="badge">'+items.length+'</span>':''}`;
  if(items.length===0){listEl.innerHTML='<div class="shop-empty">Selecciona comidas en el menú para añadir productos</div>';return;}
  listEl.innerHTML=items.map(([name,v])=>{
    const done=shopDone.has(name);
    const total=Math.round(v.r+v.g);
    const unit=v.unit||'g';
    const rStr=v.r>0?`<span class="shop-qr">R: ${Math.round(v.r)}${unit}</span>`:'';
    const gStr=v.g>0?`<span class="shop-qg">G: ${Math.round(v.g)}${unit}</span>`:'';
    return`<div class="shop-item" onclick="toggleShop('${name.replace(/'/g,"\\'")}')">
      <div class="shop-cb${done?' done':''}"><i class="ti ti-check"></i></div>
      <div class="shop-info">
        <div class="shop-label${done?' done':''}">${name}</div>
        <div class="shop-qtys">${rStr}${gStr}</div>
      </div>
      <span class="shop-total">${total}${unit}</span>
    </div>`;
  }).join('');
}

function toggleShop(name){
  if(shopDone.has(name))shopDone.delete(name);else shopDone.add(name);
  updateShoppingList();
}
function showDay(day,el){
  document.querySelectorAll('.day-view').forEach(d=>d.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('day-'+day).classList.add('active');
  el.classList.add('active');
}
function showView(v){
  document.getElementById('view-menu').style.display=v==='menu'?'block':'none';
  document.getElementById('view-lista').style.display=v==='lista'?'block':'none';
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{b.classList.toggle('active',(v==='menu'&&i===0)||(v==='lista'&&i===1));});
}
buildMenuDays();
</script>
